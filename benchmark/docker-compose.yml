# Same database, same data, same CPU/RAM budget for both apps.
# Lumen (PHP-FPM + nginx) on :8001  |  Laravel Octane (Swoole) on :8002
x-db-env: &db-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USERNAME: bench
  DB_PASSWORD: bench
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  CACHE_DRIVER: array
  CACHE_STORE: array
  SESSION_DRIVER: array

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bench
      MYSQL_PASSWORD: bench
      MYSQL_DATABASE: lumen
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      retries: 30

  lumen:
    build: { context: ., dockerfile: docker/fpm.Dockerfile }
    volumes: ["../examples/lumen-api:/app"]
    environment:
      <<: *db-env
      DB_DATABASE: lumen
    depends_on: { mysql: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "2", memory: 512m } } }

  lumen-web:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../examples/lumen-api:/app:ro
    ports: ["8001:80"]
    depends_on: [lumen]

  octane:
    build: { context: ., dockerfile: docker/octane.Dockerfile }
    volumes: ["../examples/octane-api:/app"]
    environment:
      <<: *db-env
      DB_DATABASE: octane
      OCTANE_SERVER: swoole
    command: >
      sh -c "php artisan config:cache && php artisan route:cache &&
             php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --workers=8 --max-requests=10000"
    ports: ["8002:8000"]
    depends_on: { mysql: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "2", memory: 512m } } }
